<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z1 — AtomCorp</title>
<style>
  :root {
    --gold: #d4a017;
    --gold-bright: #f0c040;
    --gold-dim: #8a6a0a;
    --purple: #5a1e8c;
    --purple-bright: #8b3fd8;
    --bg-dark: #0d0a1a;
    --bg-mid: #150f28;
    --text: #e8d9b0;
    --text-dim: #9a8a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg-dark);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 22px;
    background: var(--bg-mid);
    border-bottom: 1px solid rgba(212,160,23,0.15);
    flex-shrink: 0;
  }
  .topbar-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--gold); letter-spacing: 0.05em; font-size: 1rem; }
  .topbar-brand .mark { font-size: 1.25rem; }
  .token-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: rgba(139,63,216,0.12);
    border: 1px solid var(--purple-bright);
    border-radius: 20px;
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .token-indicator .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 8px #3ddc84; flex-shrink: 0; }

  .app-layout { display: flex; flex: 1; min-height: 0; }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--bg-mid);
    border-right: 1px solid rgba(212,160,23,0.12);
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 11px 12px;
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 0.88rem;
    margin-bottom: 4px;
  }
  .sidebar-item .badge {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 10px;
    background: rgba(212,160,23,0.1);
    color: var(--gold-dim);
    border: 1px solid rgba(212,160,23,0.25);
    white-space: nowrap;
  }
  .sidebar-footnote {
    margin-top: auto;
    font-size: 0.72rem;
    color: var(--text-dim);
    opacity: 0.7;
    line-height: 1.5;
    padding: 14px 12px 4px;
    border-top: 1px solid rgba(212,160,23,0.1);
  }

  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 26px; display: flex; flex-direction: column; gap: 14px; }
  .chat-empty-state { margin: auto; text-align: center; color: var(--text-dim); font-size: 0.95rem; }

  .msg { max-width: 68%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.55; }
  .msg-user { align-self: flex-end; background: rgba(212,160,23,0.12); border: 1px solid var(--gold-dim); }
  .msg-reply { align-self: flex-start; background: rgba(139,63,216,0.14); border: 1px solid var(--purple-bright); }
  .msg-text { display: block; white-space: pre-wrap; word-break: break-word; }
  .msg-route {
    display: block;
    margin-top: 6px;
    font-size: 0.64rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    opacity: 0.65;
  }

  .chat-input-row {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid rgba(212,160,23,0.12);
    background: var(--bg-mid);
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,160,23,0.2);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    font-family: inherit;
  }
  .chat-input:focus { border-color: var(--gold); }
  .chat-send {
    padding: 12px 22px;
    background: linear-gradient(135deg, var(--gold-dim), var(--gold));
    color: var(--bg-dark);
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .chat-send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(212,160,23,0.3); }
  .chat-send:disabled { opacity: 0.5; cursor: default; }

  @media (max-width: 720px) {
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand"><span class="mark">⚛</span> AtomCorp — Z1</div>
  <div class="token-indicator"><span class="dot"></span> Owner Token: Active</div>
</div>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-item"><span>Conversation History</span><span class="badge">Coming Soon</span></div>
    <div class="sidebar-item"><span>Silos</span><span class="badge">Coming Soon</span></div>
    <div class="sidebar-item"><span>Skills</span><span class="badge">Coming Soon</span></div>
    <div class="sidebar-item"><span>Connections</span><span class="badge">Coming Soon</span></div>
    <div class="sidebar-item"><span>File Sharing</span><span class="badge">Coming Soon</span></div>
    <div class="sidebar-footnote">Not as many coming soons as Claude. More than ChatGPT. Ours will actually ship.</div>
  </aside>

  <main class="chat-main">
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-empty-state" id="chatEmptyState">Say something. Z1 is listening.</div>
    </div>
    <div class="chat-input-row">
      <input type="text" class="chat-input" id="chatInput" placeholder="Message Z1…" maxlength="500" autocomplete="off">
      <button class="chat-send" id="chatSend" type="button">Send</button>
    </div>
  </main>
</div>

<script>
const CHAT_ENDPOINT = 'https://z1-system-atomcorpai.up.railway.app/chat';
const chatScroll = document.getElementById('chatScroll');
const chatInput = document.getElementById('chatInput');
const chatSend = document.getElementById('chatSend');

function appendMessage(role, text) {
  const empty = document.getElementById('chatEmptyState');
  if (empty) empty.remove();
  const msg = document.createElement('div');
  msg.className = 'msg ' + (role === 'user' ? 'msg-user' : 'msg-reply');
  const textEl = document.createElement('span');
  textEl.className = 'msg-text';
  textEl.textContent = text;
  msg.appendChild(textEl);
  chatScroll.appendChild(msg);
  chatScroll.scrollTop = chatScroll.scrollHeight;
  return msg;
}

function setRoute(msgEl, route) {
  if (!route) return;
  const tag = document.createElement('span');
  tag.className = 'msg-route';
  tag.textContent = 'routed → ' + route;
  msgEl.appendChild(tag);
}

async function sendMessage() {
  const val = chatInput.value.trim();
  if (!val) return;
  chatInput.value = '';
  chatSend.disabled = true;

  const userMsg = appendMessage('user', val);
  const replyMsg = appendMessage('reply', 'thinking…');

  try {
    const res = await fetch(CHAT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: val })
    });
    const data = await res.json();
    const reply = (data && typeof data.response === 'string') ? data.response : 'connection lost — try again in a moment.';
    replyMsg.querySelector('.msg-text').textContent = reply;
    if (data && data.routed_to) setRoute(userMsg, data.routed_to);
  } catch (e) {
    replyMsg.querySelector('.msg-text').textContent = 'connection lost — try again in a moment.';
  }

  chatScroll.scrollTop = chatScroll.scrollHeight;
  chatSend.disabled = false;
  chatInput.focus();
}

chatSend.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
